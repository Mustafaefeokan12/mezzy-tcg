<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mezzy TCG Tracker</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mezzy TCG">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/master-ball.png">
  <meta name="theme-color" content="#020617">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --bg-dark: #020617;
      --card-bg: rgba(15, 23, 42, 0.75);
      --primary: #3B82F6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --success: #10B981;
      --success-glow: rgba(16, 185, 129, 0.3);
      --danger: #EF4444;
      --warning: #F59E0B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --glass-border: rgba(255, 255, 255, 0.08);
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-dark); color: var(--text-main); 
      margin: 0; padding: 15px; padding-bottom: 50px;
      min-height: 100vh; -webkit-tap-highlight-color: transparent;
    }
    .app-container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
    .header img { width: 36px; filter: drop-shadow(0 0 6px var(--primary-glow)); }
    .header h1 { font-size: 22px; margin: 0; background: linear-gradient(90deg, #60A5FA, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
    .panel { background: var(--card-bg); padding: 20px; border-radius: 18px; border: 1px solid var(--glass-border); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .panel-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .val-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .val { font-size: 32px; font-weight: 950; color: #FFF; text-shadow: 0 2px 15px var(--primary-glow); }
    .currency-toggle { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor:pointer;}
    .stats { display: flex; justify-content: space-between; border-top: 1px solid var(--glass-border); padding-top: 12px; margin-bottom: 12px; }
    .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom:4px;}
    .stat-value { font-size: 15px; font-weight: 800; }
    .green { color: var(--success); } .red { color: var(--danger); }
    .chart-container { position: relative; height: 140px; border-top: 1px dashed var(--glass-border); padding-top: 12px; }
    
    .data-section { background: rgba(30, 58, 138, 0.25); border-color: rgba(59, 130, 246, 0.3); text-align: center; }
    .chat-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .chat-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 10px; font-size: 12px; border: 1px solid var(--glass-border); color: #BFDBFE; }
    .chat-del-btn { background: rgba(239, 68, 68, 0.2); color: #FCA5A5; border: none; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 10px; cursor:pointer;}
    
    .file-btn { background: var(--primary); color: white; padding: 12px; border-radius: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; width: 100%; border: none; box-sizing: border-box; cursor:pointer;}
    .db-status { font-size: 11px; color: #93C5FD; margin-top: 10px; }

    input.text-input, select { width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); color: white; padding: 14px; border-radius: 12px; margin-bottom: 12px; font-size: 14px; outline: none; font-weight: 500; }
    .selected-chip { display: flex; justify-content: space-between; align-items: center; background: rgba(16, 185, 129, 0.1) !important; border-color: rgba(16, 185, 129, 0.4) !important; padding: 12px 14px !important; }
    .clear-chip-btn { background: var(--danger); color: #FFF; border: none; border-radius: 50%; width: 26px; height: 26px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor:pointer;}
    .row { display: flex; gap: 10px; }
    button.add-btn { width: 100%; background: var(--success); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 800; box-shadow: 0 4px 12px var(--success-glow); cursor:pointer;}
    
    .search-results { position: absolute; top: 72px; left: 15px; right: 15px; background: #0F172A; border: 1px solid var(--primary); border-radius: 12px; max-height: 250px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 15px 30px rgba(0,0,0,0.8); }
    .suggestion-item { padding: 14px; border-bottom: 1px solid var(--glass-border); cursor:pointer;}
    .suggestion-item:active { background: rgba(59, 130, 246, 0.1); }
    
    .card-list { display: flex; flex-direction: column; gap: 12px; }
    .card-item { display: flex; flex-direction: column; gap: 10px; padding: 18px; margin-bottom: 0 !important; }
    .badge { background: rgba(255,255,255,0.12); color: #FFF; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; display: inline-block; margin-bottom: 6px; }
    .roi-badge { background: rgba(168, 85, 247, 0.15); color: #D8B4FE; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; display: inline-block; margin-bottom: 6px; margin-left: 6px; border: 1px solid rgba(168,85,247,0.3); }
    .card-actions { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--glass-border); flex-wrap:wrap; gap:8px;}
    .qty-controls { display: flex; align-items: center; gap: 12px; }
    .qty-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 28px; height: 28px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor:pointer;}
    .wts-btn { background: rgba(59, 130, 246, 0.15); color: #93C5FD; border: 1px solid rgba(59,130,246,0.3); padding: 6px 10px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor:pointer;}
    .delete-btn { background: transparent; color: #FCA5A5; border: 1px solid rgba(239,68,68,0.3); padding: 6px 10px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor:pointer;}
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/master-ball.png" alt="Pokeball">
      <h1>Mezzy TCG Tracker</h1>
    </div>

    <div class="panel data-section">
      <div class="panel-title" style="color:#FFF; justify-content:center;">Veritabanı Yöneticisi</div>
      <div id="chatManager" class="chat-list"></div>
      <div style="position:relative;">
        <label class="file-btn" for="fileInput">📁 WhatsApp ZIP Ekle</label>
        <input type="file" accept=".zip" id="fileInput" style="display:none;" onchange="parseWhatsAppZip(event)">
      </div>
      <div class="db-status" id="dbStatus">Sistem Hazır</div>
    </div>

    <div class="panel">
      <div class="panel-title">
        <span>Portföy Özeti</span>
        <span id="rateInfo" style="font-size: 9px; color: var(--primary);">Kur Çekiliyor...</span>
      </div>
      <div class="val-container">
        <div class="val" id="totalValue">0 ₺</div>
        <button class="currency-toggle" onclick="toggleCurrency()">₺ / $</button>
      </div>
      <div class="stats">
        <div style="flex:1;">
          <div class="stat-label">Aktif Maliyet</div>
          <div class="stat-value" id="totalCost">0 ₺</div>
        </div>
        <div style="flex:1; text-align: center;">
          <div class="stat-label">Beklenen Kâr</div>
          <div class="stat-value" id="expectedProfit">+0 ₺</div>
        </div>
        <div style="flex:1; text-align: right;">
          <div class="stat-label">Gerçekleşen Kâr</div>
          <div class="stat-value" id="realizedProfit">+0 ₺</div>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="portfolioChart"></canvas>
      </div>
    </div>

    <div class="panel" style="position:relative;">
      <input type="text" id="cardName" class="text-input" placeholder="🔍 Ürün ara..." oninput="searchLocal(event)" autocomplete="off">
      
      <div id="selectedCardChip" class="text-input selected-chip" style="display:none;">
        <span id="selectedCardNameText" style="font-weight:600; color:#34D399; font-size:13px; flex:1; line-height:1.4;"></span>
        <button class="clear-chip-btn" onclick="clearSelection()">✖</button>
      </div>

      <div class="search-results" id="searchResults"></div>

      <div class="row">
        <input type="number" id="buyPrice" class="text-input" placeholder="Alış Fiyatı">
        <input type="number" id="currentPrice" class="text-input" placeholder="Piyasa Değeri">
      </div>
      <div class="row">
        <input type="number" id="qtyInput" class="text-input" value="1" min="1" style="flex:0.3;">
        <select id="condition" class="text-input" style="flex:1;">
          <option value="Kusursuz (Sealed)" selected>Kusursuz (Sealed)</option>
          <option value="Akrilik Korumalı">Akrilik Korumalı</option>
          <option value="Ufak Hasarlı Kutu">Ufak Hasarlı Kutu</option>
          <option value="Yırtık Jelatin">Yırtık Jelatin</option>
        </select>
      </div>
      <button class="add-btn" onclick="addCard()">Portföye Ekle</button>
    </div>

    <div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span style="font-size:12px; font-weight:bold; color:var(--text-muted);">Aktif Envanter</span>
        <select id="sortFilter" style="background:rgba(0,0,0,0.4); border:1px solid var(--glass-border); color:#FFF; padding:6px 10px; border-radius:8px; font-size:11px; outline:none;" onchange="renderCards()">
          <option value="newest">En Yeni</option>
          <option value="profitDesc">Kârı Yüksek</option>
          <option value="costDesc">Maliyeti Yüksek</option>
          <option value="az">A-Z</option>
        </select>
      </div>
      <div class="card-list" id="cardList"></div>
    </div>

    <div style="margin-top: 30px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span style="font-size:12px; font-weight:bold; color:var(--text-muted);">Satılanlar (Geçmiş)</span>
      </div>
      <div class="card-list" id="soldList"></div>
    </div>
  </div>

  <script>
    let collection = JSON.parse(localStorage.getItem('pkmn_sealed_collection')) || [];
    let uploadedChats = JSON.parse(localStorage.getItem('wa_chats_array')) || [];
    let localMarketData = []; 
    let currentCurrency = 'TRY';
    let usdRate = 35.0; 
    let portfolioChart = null;

    const jpExclusiveSets = ["terastal", "vstar universe", "shiny treasure", "eevee heroes", "clay burst", "snow hazard", "ruler of the black flame", "wild force", "cyber judge", "crimson haze", "mask of change", "night wanderer", "stellar miracle", "paradigm trigger", "incandescent arcana", "lost abyss", "dark phantasma", "time gazer", "space juggler", "battle region", "star birth", "vmax climax", "shiny star v", "tag all stars"];
    const cnExclusiveSets = ["gem pack", "nine color", "crossing the sky", "shadow of glory", "brave stars", "pinnacle clash", "dynamax clash", "sun & moon"];

    async function initApp() {
      refreshDatabase();
      try {
        let res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
        let data = await res.json();
        usdRate = data.rates.TRY;
        document.getElementById('rateInfo').innerText = `1$ = ${usdRate.toFixed(2)}₺`;
      } catch(e) { document.getElementById('rateInfo').innerText = `Kur: 35.0₺`; }
      renderDashboard(); renderCards();
    }

    function toggleCurrency() { currentCurrency = currentCurrency === 'TRY' ? 'USD' : 'TRY'; renderDashboard(); renderCards(); }
    function formatMoney(v) { return currentCurrency === 'USD' ? (v/usdRate).toFixed(1) + ' $' : v.toLocaleString('tr-TR') + ' ₺'; }

    function detectLanguage(text) {
      if (!text) return "🇬🇧"; 
      const lower = text.toLowerCase();
      if (/(^|\s|\-|\.|\[)(çin|çince|chinese|cn)(\s|$|\-|\.|\])/i.test(lower)) return "🇨🇳";
      if (/(^|\s|\-|\.|\[)(jap|jp|japon|japonca|japanese)(\s|$|\-|\.|\])/i.test(lower)) return "🇯🇵";
      if (/(^|\s|\-|\.|\[)(kor|kore|korece|korean|kr)(\s|$|\-|\.|\])/i.test(lower)) return "🇰🇷";
      if (/(^|\s|\-|\.|\[)(eng|ing|english|ingilizce|en|uk|us)(\s|$|\-|\.|\])/i.test(lower)) return "🇬🇧";
      for (let set of jpExclusiveSets) { if (lower.includes(set)) return "🇯🇵"; }
      for (let set of cnExclusiveSets) { if (lower.includes(set)) return "🇨🇳"; }
      return "🇬🇧"; 
    }

    function extractCleanName(text) {
      let clean = text.replace(/\d{1,3}(?:[\.\,]\d{3})*(?:[\.\,]\d+)?\s*(tl|₺|usd|\$|try)\b/gi, '');
      clean = clean.replace(/\(?\d+\s*(x|adet)\)?/gi, '');
      clean = clean.replace(/\b(görüntü|dahil|edilmedi|omitted|satılık|wts|satilik|acil|karışık|kartları|kart|mevcut|son|tekli|satılmıştır|satildi)\b/gi, '');
      clean = clean.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF])/g, '');
      clean = clean.replace(/[\[\]\-\_\.\~\:\(\)]/g, ' ').replace(/\s{2,}/g, ' ').trim();
      clean = clean.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
      clean = clean.replace(/\bEtb\b/gi, 'ETB').replace(/\bUpc\b/gi, 'UPC').replace(/\bVmax\b/gi, 'VMAX').replace(/\bVstar\b/gi, 'VSTAR').replace(/\bEx\b/gi, 'EX');
      clean = clean.replace(/\bBooster Box\b/gi, 'Booster Box').replace(/\bBooster Pack\b/gi, 'Booster Pack').replace(/\bBooster Bundle\b/gi, 'Booster Bundle');
      return clean.trim();
    }

    function refreshDatabase() {
      localMarketData = uploadedChats.flatMap(c => c.data);
      let cm = document.getElementById('chatManager'); cm.innerHTML = '';
      uploadedChats.forEach(c => {
        cm.innerHTML += `<div class="chat-row"><span>📦 ${c.name} (${c.data.length})</span><button class="chat-del-btn" onclick="deleteChat(${c.id})">Sil</button></div>`;
      });
      document.getElementById('dbStatus').innerText = uploadedChats.length > 0 ? `${localMarketData.length} ilan aktif.` : `Sohbet ZIP'i ekleyin.`;
    }

    function deleteChat(id) { uploadedChats = uploadedChats.filter(c => c.id !== id); localStorage.setItem('wa_chats_array', JSON.stringify(uploadedChats)); refreshDatabase(); }

    async function parseWhatsAppZip(e) {
      let file = e.target.files[0]; if(!file) return;
      document.getElementById('dbStatus').innerText = "Yükleniyor...";
      try {
        let zip = new JSZip(); let zData = await zip.loadAsync(file);
        let txt = "";
        for(let fn of Object.keys(zData.files)) { if(fn.endsWith('.txt')) { txt = await zData.files[fn].async("string"); break; } }
        let lines = txt.split('\n'); let data = [];
        const waPrefixRegex = /^\[?\d{1,2}[\/\.]\d{1,2}[\/\.]\d{2,4}[, ]+\d{1,2}:\d{2}(:\d{2})?(?:\s*[A-Z]{2})?\]?\s*[\-~]?\s*([^:]+):/i;

        lines.forEach(line => {
          let low = line.toLowerCase();
          if((low.includes('tl') || low.includes('₺') || low.includes('$')) && (low.includes('etb') || low.includes('bundle') || low.includes('booster') || low.includes('box') || low.includes('pack'))) {
            let lister = "Satıcı"; let pText = line;
            const match = line.match(waPrefixRegex);
            if (match) { lister = match[2].trim(); pText = line.replace(match[0], '').trim(); }
            if (lister.length > 20) lister = lister.substring(0, 18) + '..';

            let mPrice = pText.match(/(\d+(?:[\.\,]\d+)?(?:[\.\,]\d+)?)\s*(tl|\$|₺)/i);
            if(mPrice) {
              let numStr = mPrice[1];
              let pMatch = numStr.match(/[\.\,]/g);
              if (pMatch) {
                  let parts = numStr.split(/[\.\,]/);
                  let lastPart = parts.pop(); 
                  if (lastPart.length === 3) numStr = numStr.replace(/[\.\,]/g, '');
                  else numStr = parts.join('').replace(/[\.\,]/g, '') + '.' + lastPart;
              }
              let p = parseFloat(numStr);
              if(low.includes('$')) p *= usdRate;
              else if(p > 0 && p < 200) p *= 1000;
              
              let name = extractCleanName(pText);
              if(name.length > 2) data.push({ rawText: pText, product: name, lister: lister, price: p });
            }
          }
        });
        uploadedChats.push({ id: Date.now(), name: file.name.substring(0,12), data: data.reverse() });
        localStorage.setItem('wa_chats_array', JSON.stringify(uploadedChats));
        refreshDatabase();
      } catch(err) { document.getElementById('dbStatus').innerText = "Hata oluştu!"; }
    }

    function searchLocal(e) {
      let q = e.target.value.toLowerCase().trim();
      let res = document.getElementById('searchResults');
      if(q.length < 2) { res.style.display = 'none'; return; }
      
      let queryWords = q.split(' ').filter(w => w.length > 1);
      let scored = localMarketData.map(item => {
        let score = 0; let target = item.product.toLowerCase();
        if (target.includes(q)) score += 10;
        queryWords.forEach(word => { if (target.includes(word)) score += 3; });
        return { ...item, score };
      }).filter(item => item.score > 0);

      scored.sort((a, b) => b.score - a.score);
      let matches = scored.slice(0, 20);

      if(matches.length === 0) { res.style.display = 'none'; return; }
      res.innerHTML = '';
      
      let uniqueSellers = new Set(); let validPrices = [];
      let commonFlag = detectLanguage(matches[0].rawText || matches[0].product); 

      for (let m of matches) {
        if (!uniqueSellers.has(m.lister)) { uniqueSellers.add(m.lister); validPrices.push(m.price); }
      }

      // Ortalama panelini EN ÜSTTE göster (En az 2 ilan varsa)
      if (validPrices.length >= 2) {
        let sum = validPrices.reduce((a, b) => a + b, 0);
        let estimatedPrice = Math.round(sum / validPrices.length);
        let pureName = `${commonFlag} ${matches[0].product}`;
        
        let estDiv = document.createElement('div');
        estDiv.className = 'suggestion-item';
        estDiv.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
        estDiv.style.borderBottom = '2px solid rgba(16, 185, 129, 0.4)';
        estDiv.onclick = () => selectCard(`${pureName}`, estimatedPrice);
        
        estDiv.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="color:#34D399; font-weight:800; font-size:11px; text-transform:uppercase;">💡 Sistem Tahmini (Ortalama)</div>
            <div style="color:#10B981; font-weight:900; font-size:15px;">${estimatedPrice.toLocaleString('tr-TR')} ₺</div>
          </div>
          <div style="color:#FFF; font-weight:700; font-size:14px; margin-top:6px;">${pureName}</div>
          <div style="font-size:10px; color:#94A3B8; margin-top:4px;">${validPrices.length} farklı satıcı baz alındı.</div>
        `;
        res.appendChild(estDiv);
      }

      // Normal ilanları altına listele
      matches.forEach(m => {
        let flag = detectLanguage(m.rawText || m.product);
        let displayName = `${flag} ${m.product} - 👤 ${m.lister}`;
        let div = document.createElement('div'); div.className = 'suggestion-item';
        div.onclick = () => selectCard(displayName, m.price);
        div.innerHTML = `<div style="display:flex;flex-direction:column;gap:4px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;"><span style="color:#FFF;font-weight:600;">${flag} ${m.product}</span><span style="color:#10B981;font-weight:bold;">${m.price.toLocaleString('tr-TR')}₺</span></div>
          <div style="font-size:11px; color:var(--text-muted);">Satıcı: ${m.lister}</div>
        </div>`;
        res.appendChild(div);
      });
      res.style.display = 'block';
    }

    function selectCard(name, price) {
      document.getElementById('cardName').value = name;
      document.getElementById('currentPrice').value = price;
      document.getElementById('cardName').style.display = 'none';
      document.getElementById('selectedCardNameText').innerText = name;
      document.getElementById('selectedCardChip').style.display = 'flex';
      document.getElementById('searchResults').style.display = 'none';
    }

    function clearSelection() {
      document.getElementById('cardName').value = '';
      document.getElementById('cardName').style.display = 'block';
      document.getElementById('selectedCardChip').style.display = 'none';
      document.getElementById('currentPrice').value = '';
    }

    function saveAndRender() { localStorage.setItem('pkmn_sealed_collection', JSON.stringify(collection)); renderDashboard(); renderCards(); }

    function addCard() {
      let name = document.getElementById('cardName').value;
      let buy = parseFloat(document.getElementById('buyPrice').value) || 0;
      let current = parseFloat(document.getElementById('currentPrice').value);
      let cond = document.getElementById('condition').value;
      let qty = parseInt(document.getElementById('qtyInput').value) || 1;
      if(!name || isNaN(current)) { alert("Ürün adı ve piyasa değeri zorunludur."); return; }
      
      // status 'active' olarak eklenir
      collection.unshift({ id: Date.now(), name, buy, current, cond, qty, status: 'active' });
      saveAndRender(); clearSelection();
      document.getElementById('buyPrice').value = ''; document.getElementById('qtyInput').value = '1';
    }

    function updateQty(id, d) { let c = collection.find(x => x.id === id); if(c) { c.qty += d; if(c.qty <= 0) deleteCard(id); else saveAndRender(); } }
    function deleteCard(id) { collection = collection.filter(x => x.id !== id); saveAndRender(); }
    
    // YENİ: Satış Fonksiyonu
    function sellCard(id) {
      let c = collection.find(x => x.id === id);
      if(c) {
        let sellPrice = prompt(`${c.name}\nLütfen BİRİM satış fiyatını girin (₺):`, c.current);
        if (sellPrice !== null && sellPrice.trim() !== "") {
          let p = parseFloat(sellPrice.replace(',', '.'));
          if (!isNaN(p) && p >= 0) {
            c.status = 'sold';
            c.soldPrice = p;
            let d = new Date();
            c.soldDate = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
            saveAndRender();
          } else { alert("Geçersiz fiyat girdiniz."); }
        }
      }
    }

    // YENİ: Satışı Geri Al
    function undoSell(id) {
      let c = collection.find(x => x.id === id);
      if(c) { c.status = 'active'; delete c.soldPrice; delete c.soldDate; saveAndRender(); }
    }
    
    function copyWTS(id) {
      let c = collection.find(x => x.id === id);
      if(c) {
        navigator.clipboard.writeText(`WTS 🟢\n\n📦 ${c.name}\n✨ Kondisyon: ${c.cond}\n💵 Fiyat: ${c.current.toLocaleString('tr-TR')} TL\n\nDM atabilirsiniz.`);
        alert("WTS metni kopyalandı!");
      }
    }

    function renderDashboard() {
      // Eski verilerde status yoksa active say
      let activeCards = collection.filter(c => c.status !== 'sold');
      let soldCards = collection.filter(c => c.status === 'sold');

      let activeCost = activeCards.reduce((s, c) => s + (c.buy * c.qty), 0);
      let activeVal = activeCards.reduce((s, c) => s + (c.current * c.qty), 0);
      let expectedProfit = activeVal - activeCost;
      let realizedProfit = soldCards.reduce((s, c) => s + ((c.soldPrice - c.buy) * c.qty), 0);
      
      document.getElementById('totalValue').innerText = formatMoney(activeVal);
      document.getElementById('totalCost').innerText = formatMoney(activeCost);
      
      let expEl = document.getElementById('expectedProfit');
      expEl.innerText = (expectedProfit >= 0 ? '+' : '') + formatMoney(expectedProfit);
      expEl.className = 'stat-value ' + (expectedProfit >= 0 ? 'green' : 'red');

      let realEl = document.getElementById('realizedProfit');
      realEl.innerText = (realizedProfit >= 0 ? '+' : '') + formatMoney(realizedProfit);
      realEl.className = 'stat-value ' + (realizedProfit >= 0 ? 'green' : 'red');

      let conds = {};
      activeCards.forEach(c => { conds[c.cond] = (conds[c.cond] || 0) + (c.current * c.qty); });
      let ctx = document.getElementById('portfolioChart').getContext('2d');
      if(portfolioChart) portfolioChart.destroy();
      portfolioChart = new Chart(ctx, { type: 'doughnut', data: { labels: Object.keys(conds), datasets: [{ data: Object.values(conds), backgroundColor: ['#3B82F6', '#10B981', '#F59E0B', '#EF4444'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 9 } } } }, cutout: '65%' } });
    }

    function renderCards() {
      let activeList = document.getElementById('cardList'); activeList.innerHTML = '';
      let soldList = document.getElementById('soldList'); soldList.innerHTML = '';
      
      let activeCards = collection.filter(c => c.status !== 'sold');
      let soldCards = collection.filter(c => c.status === 'sold');

      let sType = document.getElementById('sortFilter').value;
      if(sType === 'profitDesc') activeCards.sort((a,b) => ((b.current-b.buy)*b.qty) - ((a.current-a.buy)*a.qty));
      else if(sType === 'costDesc') activeCards.sort((a,b) => (b.buy*b.qty) - (a.buy*a.qty));
      else if(sType === 'az') activeCards.sort((a,b) => a.name.localeCompare(b.name));

      // Aktif Kartları Listele
      activeCards.forEach(c => {
        let p = (c.current - c.buy) * c.qty;
        let roi = c.buy > 0 ? `%${(((c.current - c.buy)/c.buy)*100).toFixed(0)}` : 'Trade';
        activeList.innerHTML += `
          <div class="panel card-item">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div>
                <h3 style="margin:0 0 6px 0; font-size:14px; font-weight:700;">${c.name}</h3>
                <span class="badge">${c.cond}</span><span class="roi-badge">ROI: ${roi}</span>
                <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">Birim Alış: <b>${formatMoney(c.buy)}</b> | Piyasa: <b style="color:var(--success);">${formatMoney(c.current)}</b></div>
                <div class="${p >= 0 ? 'green' : 'red'}" style="font-size:12px; font-weight:800; margin-top:4px;">Beklenen K/Z: ${p >= 0 ? '+' : ''}${formatMoney(p)}</div>
              </div>
            </div>
            <div class="card-actions">
              <div class="qty-controls">
                <button class="qty-btn" onclick="updateQty(${c.id}, -1)">-</button>
                <span style="font-size:13px; font-weight:bold; width:30px; text-align:center;">${c.qty}</span>
                <button class="qty-btn" onclick="updateQty(${c.id}, 1)">+</button>
              </div>
              <div style="display:flex; gap:6px;">
                <button class="wts-btn" onclick="sellCard(${c.id})" style="background:rgba(16, 185, 129, 0.15); color:#34D399; border-color:rgba(16,185,129,0.3);">Sat</button>
                <button class="wts-btn" onclick="copyWTS(${c.id})">WTS</button>
                <button class="delete-btn" onclick="deleteCard(${c.id})">Sil</button>
              </div>
            </div>
          </div>`;
      });

      // Satılan Kartları Listele
      soldCards.forEach(c => {
        let p = (c.soldPrice - c.buy) * c.qty;
        let roi = c.buy > 0 ? `%${(((c.soldPrice - c.buy)/c.buy)*100).toFixed(0)}` : 'Trade';
        soldList.innerHTML += `
          <div class="panel card-item" style="border-color: rgba(16, 185, 129, 0.3);">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div style="flex:1; opacity:0.85;">
                <h3 style="margin:0 0 6px 0; font-size:14px; font-weight:700; text-decoration:line-through;">${c.name}</h3>
                <span class="badge" style="background:rgba(16,185,129,0.2); color:#34D399;">Satıldı (${c.soldDate || '-'})</span><span class="roi-badge">ROI: ${roi}</span>
                <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">Birim Alış: <b>${formatMoney(c.buy)}</b> | Satış: <b style="color:var(--success);">${formatMoney(c.soldPrice)}</b></div>
                <div class="${p >= 0 ? 'green' : 'red'}" style="font-size:12px; font-weight:800; margin-top:4px;">Gerçekleşen Net K/Z: ${p >= 0 ? '+' : ''}${formatMoney(p)}</div>
              </div>
            </div>
            <div class="card-actions" style="justify-content:flex-end;">
              <div style="display:flex; gap:6px;">
                <button class="wts-btn" onclick="undoSell(${c.id})" style="background:rgba(245, 158, 11, 0.15); color:#FCD34D; border-color:rgba(245,158,11,0.3);">Geri Al</button>
                <button class="delete-btn" onclick="deleteCard(${c.id})">Sil</button>
              </div>
            </div>
          </div>`;
      });
    }

    initApp();
  </script>
</body>
</html>
